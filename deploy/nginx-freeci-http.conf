# FreeCI — vhost nginx initial (HTTP seul) ; « certbot --nginx -d freeci.dgafrique.com --redirect » y ajoutera HTTPS.
# Installation : voir docs/08. PHP-FPM : pool dédié « freeci » (socket /run/php/freeci-fpm.sock).
server {
    listen 80;
    listen [::]:80;
    server_name freeci.dgafrique.com;
    root /var/www/freeci/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;
    server_tokens off;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        # Le snippet Debian/Ubuntu contient déjà « try_files $fastcgi_script_name =404; » : ne pas le répéter ici.
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/freeci-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) { deny all; return 404; }

    access_log /var/log/nginx/freeci.access.log;
    error_log  /var/log/nginx/freeci.error.log warn;
}
